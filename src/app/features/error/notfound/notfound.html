<section
  class="relative flex min-h-screen items-center justify-center overflow-hidden bg-white px-6 py-12"
>
  <!-- Background Decorations -->
  <div class="absolute -left-32 -top-32 h-96 w-96 rounded-full bg-blue-50"></div>

  <div class="absolute -bottom-40 -right-32 h-96 w-96 rounded-full bg-blue-50"></div>

  <!-- Content -->
  <div
    class="relative z-10 mx-auto grid w-full max-w-6xl items-center gap-12 md:grid-cols-2 md:gap-16"
  >
    <!-- Text Content -->
    <div class="text-center md:text-left">
      <span
        class="inline-flex items-center rounded-full border border-blue-100 bg-blue-50 px-4 py-2 text-sm font-semibold text-blue-600"
      >
        <i class="fa-solid fa-circle-exclamation mr-2"></i>
        Page Not Found
      </span>

      <h1 class="mt-6 text-8xl font-black tracking-tight text-blue-600 sm:text-9xl">404</h1>

      <h2 class="mt-4 text-3xl font-bold tracking-tight text-blue-950 sm:text-4xl">
        Oops! Lost in the blue.
      </h2>

      <p class="mx-auto mt-5 max-w-md text-base leading-8 text-blue-400 md:mx-0">
        The page you're looking for doesn't exist or may have been moved. Let's get you back to your
        feed.
      </p>

      <!-- Navigate to Feed -->
      <a
        routerLink="/feed"
        class="mt-8 inline-flex items-center justify-center gap-3 rounded-2xl bg-blue-600 px-7 py-4 font-semibold text-white shadow-lg shadow-blue-200 transition-all duration-300 hover:-translate-y-1 hover:bg-blue-700 hover:shadow-xl hover:shadow-blue-200 focus:outline-none focus:ring-4 focus:ring-blue-200"
      >
        <i class="fa-solid fa-arrow-left"></i>
        Back to Feed
      </a>

      <p class="mt-6 text-sm text-blue-300">
        <i class="fa-solid fa-shield-halved mr-1"></i>
        Don't worry, your account is safe.
      </p>
    </div>

    <!-- Illustration -->
    <div class="relative mx-auto w-full max-w-lg">
      <div class="absolute inset-10 rounded-full bg-blue-50 blur-3xl"></div>

      <div
        class="relative flex aspect-square items-center justify-center rounded-[3rem] border border-blue-100 bg-gradient-to-br from-blue-50 via-white to-blue-100 p-8"
      >
        <!-- Decorative circles -->
        <div class="absolute right-12 top-12 h-5 w-5 rounded-full bg-blue-300"></div>

        <div class="absolute bottom-16 left-12 h-8 w-8 rounded-full bg-blue-200"></div>

        <!-- 404 Illustration -->
        <div class="relative text-center">
          <i class="fa-solid fa-map-location-dot text-8xl text-blue-500 sm:text-9xl"></i>

          <div
            class="absolute -right-8 -top-8 flex h-16 w-16 items-center justify-center rounded-2xl border-4 border-white bg-blue-600 text-2xl font-black text-white shadow-lg shadow-blue-200"
          >
            ?
          </div>

          <div
            class="mt-8 rounded-3xl border border-blue-100 bg-white px-8 py-5 shadow-xl shadow-blue-100/70"
          >
            <span class="text-4xl font-black tracking-widest text-blue-600"> 404 </span>

            <p class="mt-2 text-sm font-medium text-blue-400">Page out of sight</p>
          </div>
        </div>
      </div>

      <!-- Floating label -->
      <div
        class="absolute -bottom-5 right-4 rounded-2xl border border-blue-100 bg-white px-5 py-3 shadow-lg shadow-blue-100 sm:right-8"
      >
        <div class="flex items-center gap-3">
          <div
            class="flex h-10 w-10 items-center justify-center rounded-xl bg-blue-50 text-blue-600"
          >
            <i class="fa-solid fa-house"></i>
          </div>

          <div>
            <p class="text-sm font-bold text-blue-950">Find your way</p>
            <p class="text-xs text-blue-400">Back to your community</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
