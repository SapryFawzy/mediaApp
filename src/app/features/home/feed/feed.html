<div
  class="container mx-auto grid w-full min-w-0 grid-cols-1 gap-4 px-3 pt-4 sm:px-4 md:gap-5 lg:gap-5 lg:px-5 xl:grid-cols-[200px_minmax(0,2fr)_minmax(240px,1fr)] 2xl:grid-cols-[240px_minmax(0,2fr)_minmax(260px,1fr)]"
>
  <!-- Sidebar -->

  <aside class="min-w-0 w-full xl:sticky xl:top-21 xl:h-fit">
    <div
      class="grid grid-cols-2 gap-2 rounded-2xl border border-slate-200 bg-white p-3 shadow-sm xl:flex xl:flex-col xl:gap-1"
    >
      <button
        type="button"
        (click)="swapPosts('feed')"
        [class]="
          postsType() === 'feed'
            ? 'bg-[#e7f3ff] text-[#1877f2]'
            : 'text-slate-700 hover:bg-slate-100'
        "
        class="flex min-w-0 items-center gap-2 rounded-xl px-3 py-3 text-left text-sm font-bold transition sm:gap-3"
      >
        <!-- Feed icon -->
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="17"
          height="17"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          class="shrink-0"
        >
          <path d="M15 18h-5"></path>
          <path d="M18 14h-8"></path>
          <path
            d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-4 0v-9a2 2 0 0 1 2-2h2"
          ></path>
          <rect width="8" height="4" x="10" y="6" rx="1"></rect>
        </svg>
        <span class="truncate">Feed</span>
      </button>

      <button
        type="button"
        (click)="swapPosts('myPosts')"
        [class]="
          postsType() === 'myPosts'
            ? 'bg-[#e7f3ff] text-[#1877f2]'
            : 'text-slate-700 hover:bg-slate-100'
        "
        class="flex min-w-0 items-center gap-2 rounded-xl px-3 py-3 text-left text-sm font-bold transition sm:gap-3"
      >
        <!-- My Posts icon -->
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="17"
          height="17"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          class="shrink-0"
        >
          <path
            d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z"
          ></path>
          <path d="M20 2v4"></path>
          <path d="M22 4h-4"></path>
          <circle cx="4" cy="20" r="2"></circle>
        </svg>
        <span class="truncate">My Posts</span>
      </button>

      <button
        type="button"
        (click)="swapPosts('community')"
        [class]="
          postsType() === 'community'
            ? 'bg-[#e7f3ff] text-[#1877f2]'
            : 'text-slate-700 hover:bg-slate-100'
        "
        class="flex min-w-0 items-center gap-2 rounded-xl px-3 py-3 text-left text-sm font-bold transition sm:gap-3"
      >
        <!-- Community icon -->
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="17"
          height="17"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          class="shrink-0"
        >
          <path d="M21.54 15H17a2 2 0 0 0-2 2v4.54"></path>
          <path
            d="M7 3.34V5a3 3 0 0 0 3 3a2 2 0 0 1 2 2c0 1.1.9 2 2 2a2 2 0 0 0 2-2c0-1.1.9-2 2-2h3.17"
          ></path>
          <path d="M11 21.95V18a2 2 0 0 0-2-2a2 2 0 0 1-2-2v-1a2 2 0 0 0-2-2H2.05"></path>
          <circle cx="12" cy="12" r="10"></circle>
        </svg>
        <span class="truncate">Community</span>
      </button>

      <button
        type="button"
        (click)="swapPosts('saved')"
        [class]="
          postsType() === 'saved'
            ? 'bg-[#e7f3ff] text-[#1877f2]'
            : 'text-slate-700 hover:bg-slate-100'
        "
        class="flex min-w-0 items-center gap-2 rounded-xl px-3 py-3 text-left text-sm font-bold transition sm:gap-3"
      >
        <!-- Saved icon -->
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="17"
          height="17"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          class="shrink-0"
        >
          <path
            d="M17 3a2 2 0 0 1 2 2v15a1 1 0 0 1-1.496.868l-4.512-2.578a2 2 0 0 0-1.984 0l-4.512 2.578A1 1 0 0 1 5 20V5a2 2 0 0 1 2-2z"
          ></path>
        </svg>
        <span class="truncate">Saved</span>
      </button>
    </div>
  </aside>

  <!-- Posts: allow the component to shrink without overflowing the grid -->
  <main class="min-w-0 w-full">
    <app-posts [postesType]="postsType()"></app-posts>
  </main>

  <!-- Suggestions -->
  <app-suggests-frends></app-suggests-frends>
</div>
