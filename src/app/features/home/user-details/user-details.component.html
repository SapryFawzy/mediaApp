<div class="mx-auto max-w-7xl px-3 py-3.5">
  <div class="min-w-0">
    <div class="space-y-4">
      <button
        (click)="goBack()"
        class="inline-flex items-center gap-2 rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm font-bold text-slate-700 transition hover:bg-slate-50"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="lucide lucide-arrow-left"
          aria-hidden="true"
        >
          <path d="m12 19-7-7 7-7"></path>
          <path d="M19 12H5"></path></svg
        >Back
      </button>
      <section class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm">
        <div
          [class]="'bg-cover bg-center bg-no-repeat'"
          [style.background]="
            userProfileData().cover
              ? 'url(' + userProfileData().cover + ') center / cover no-repeat'
              : 'linear-gradient(112deg, #0f172a 0%, #1e3a5f 36%, #2b5178 72%, #5f8fb8 100%)'
          "
          class="group/cover relative h-44 sm:h-52 lg:h-60"
        ></div>
        <div class="relative -mt-14 px-3 pb-5 sm:px-5">
          <div
            class="flex flex-wrap items-end justify-between gap-4 rounded-2xl border border-white/70 bg-white/95 p-4"
          >
            <div class="flex items-end gap-3">
              <img
                [alt]="userProfileData().name"
                class="h-20 w-20 rounded-full border-4 border-white object-cover shadow-sm sm:h-24 sm:w-24"
                [src]="userProfileData().photo"
              />
              <div>
                <p class="text-xl font-black text-slate-900 sm:text-2xl">
                  {{ userProfileData().name }}
                </p>
                <p class="text-sm font-semibold text-slate-500 sm:text-base">
                  {{ userProfileData().username }}
                </p>
              </div>
            </div>
            <button
              (click)="followAndUnFollow()"
              type="button"
              class="inline-flex w-full items-center justify-center gap-2 rounded-lg px-4 py-2 text-sm font-extrabold transition sm:w-auto bg-[#1877f2] text-white hover:bg-[#166fe5]"
            >
              @if (!isFollowing()) {
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="lucide lucide-user-plus"
                  aria-hidden="true"
                >
                  <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
                  <circle cx="9" cy="7" r="4"></circle>
                  <line x1="19" x2="19" y1="8" y2="14"></line>
                  <line x1="22" x2="16" y1="11" y2="11"></line>
                </svg>
              }
              {{ isFollowing() ? 'Followed' : 'Follow' }}
            </button>
          </div>
        </div>
      </section>

      <section class="space-y-3">
        @if (userposts().length) {
          @for (post of userposts(); track post._id) {
            <div class="my-4">
              <app-post [postData]="post"></app-post>
            </div>
          }
        } @else {
          <div class="my-4">
            <p class="rounded-xl border border-slate-200 bg-slate-50 p-4 text-sm text-slate-500">
              User have not posted yet.
            </p>
          </div>
        }
      </section>
    </div>
  </div>
</div>
