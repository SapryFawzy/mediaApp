<div class="mx-auto max-w-7xl px-3 py-3.5">
  <main class="min-w-0">
    <div class="mx-auto max-w-2xl">
      <section class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm sm:p-6">
        <div class="mb-5 flex items-center gap-3">
          <span
            class="inline-flex h-10 w-10 items-center justify-center rounded-full bg-[#e7f3ff] text-[#1877f2]"
            ><svg
              xmlns="http://www.w3.org/2000/svg"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-key-round"
              aria-hidden="true"
            >
              <path
                d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z"
              ></path>
              <circle cx="16.5" cy="7.5" r=".5" fill="currentColor"></circle></svg
          ></span>
          <div>
            <h1 class="text-xl font-extrabold text-slate-900 sm:text-2xl">Change Password</h1>
            <p class="text-sm text-slate-500">
              Keep your account secure by using a strong password.
            </p>
          </div>
        </div>
        <form [formGroup]="changePasswordForm" (ngSubmit)="changePassword()" class="space-y-4">
          <label class="block relative"
            ><span class="mb-1.5 block text-sm font-bold text-slate-700">Current password</span>
            <input
              #oldpass
              formControlName="password"
              placeholder="Enter current password"
              class="w-full rounded-xl border bg-slate-50 px-3 py-2.5 text-sm text-slate-800 outline-none transition border-slate-200 focus:border-[#1877f2] focus:bg-white"
              type="password"
              value=""
              autocomplete="new-password"
              name="currentPassword"
            />
            <div (click)="showPassword(oldpass)" class="absolute top-1/2 mt-4 -translate-y-1/2 right-4">
              <i
                [class]="{
                  'fa-eye': oldpass.type == 'password',
                  'fa-eye-slash': oldpass.type == 'text',
                }"
                class="fa-solid"
              ></i>
            </div> </label
          ><label class="block relative"
            ><span class="mb-1.5 block text-sm font-bold text-slate-700">New password</span>
            <input
              #newpass
              formControlName="newPassword"
              placeholder="Enter new password"
              class="w-full rounded-xl border bg-slate-50 px-3 py-2.5 text-sm text-slate-800 outline-none transition border-slate-200 focus:border-[#1877f2] focus:bg-white"
              type="password"
              value=""
              name="newPassword"
            />
            <div (click)="showPassword(newpass)" class="absolute mt-1 top-1/2 -translate-y-1/2 right-4">
              <i
                [class]="{
                  'fa-eye': newpass.type == 'password',
                  'fa-eye-slash': newpass.type == 'text',
                }"
                class="fa-solid"
              ></i>
            </div>
            <span class="mt-1 block text-xs text-slate-500"
              >At least 8 characters with uppercase, lowercase, number, and special character.</span
            ></label
          >
          <label class="block relative"
            ><span class="mb-1.5 block text-sm font-bold text-slate-700">Confirm new password</span
            ><input
              #renewpass
              [formControl]="reNewPassword"
              placeholder="Re-enter new password"
              class="w-full rounded-xl border bg-slate-50 px-3 py-2.5 text-sm text-slate-800 outline-none transition border-slate-200 focus:border-[#1877f2] focus:bg-white"
              type="password"
              value=""
              name="confirmPassword"
            />
            <div
              (click)="showPassword(renewpass)"
              class="absolute top-1/2 mt-4 -translate-y-1/2 right-4"
            >
              <i
                [class]="{
                  'fa-eye': renewpass.type == 'password',
                  'fa-eye-slash': renewpass.type == 'text',
                }"
                class="fa-solid"
              ></i>
            </div>
          </label>
          @if (showError()) {
            <div class="border-red-400 border rounded-2xl mt-2 py-2 px-4">
              <app-form-error-msg
                [errorMsg]="'reNewPassword do not Match newPassword'"
              ></app-form-error-msg>
            </div>
          }
          <button
            type="submit"
            class="inline-flex w-full items-center justify-center rounded-xl bg-[#1877f2] px-4 py-2.5 text-sm font-bold text-white transition hover:bg-[#166fe5]"
          >
            Update password
          </button>
        </form>
      </section>
    </div>
  </main>
</div>
