<header
  class="sticky top-0 inset-x-0 z-50 border-b border-gray-100 bg-white/95 shadow-sm backdrop-blur-lg"
>
  <div
    class="mx-auto flex h-16 sm:h-20 max-w-7xl items-center justify-between gap-3 px-3 sm:gap-6 sm:px-5 lg:px-8"
  >
    <!-- Main Navigation -->
    <nav class="flex w-full min-w-0 items-center justify-between gap-2 sm:gap-6">
      <!-- Brand -->
      <a
        routerLink="/feed"
        aria-label="Route Posts feed"
        title="Route Posts"
        class="flex shrink-0 items-center gap-2 sm:gap-3"
      >
        <img src="route.png" alt="" class="h-8 w-8 shrink-0 object-contain sm:h-10 sm:w-10" />

        <span
          class="hidden whitespace-nowrap text-xl font-bold tracking-tight text-gray-900 md:inline lg:text-2xl"
        >
          Route <span class="text-blue-600">Posts</span>
        </span>
      </a>

      <!-- Main Links: Icons only on smaller screens -->
      <div
        aria-label="Main navigation"
        class="flex min-w-0 items-center justify-center gap-0.5 sm:gap-2"
      >
        <a
          routerLink="/feed"
          routerLinkActive="!text-blue-600 bg-blue-50"
          aria-label="Feed"
          title="Feed"
          class="inline-flex shrink-0 items-center justify-center gap-2 rounded-xl p-2.5 text-sm font-semibold text-gray-600 transition-colors hover:bg-gray-50 hover:text-blue-600 sm:px-3 sm:py-2"
        >
          <i class="fa-solid fa-house text-lg"></i>
          <span class="hidden whitespace-nowrap lg:inline">Feed</span>
        </a>

        <a
          routerLink="/profile"
          routerLinkActive="!text-blue-600 bg-blue-50"
          aria-label="Profile"
          title="Profile"
          class="inline-flex shrink-0 items-center justify-center gap-2 rounded-xl p-2.5 text-sm font-semibold text-gray-600 transition-colors hover:bg-gray-50 hover:text-blue-600 sm:px-3 sm:py-2"
        >
          <i class="fa-regular fa-user text-lg"></i>
          <span class="hidden whitespace-nowrap lg:inline">Profile</span>
        </a>

        <a
          routerLink="/notifications"
          routerLinkActive="!text-blue-600 bg-blue-50"
          aria-label="Notifications"
          title="Notifications"
          class="relative inline-flex shrink-0 items-center justify-center gap-2 rounded-xl p-2.5 text-sm font-semibold text-gray-600 transition-colors hover:bg-gray-50 hover:text-blue-600 sm:px-3 sm:py-2"
        >
          <i class="fa-regular fa-bell text-lg"></i>
          <span class="hidden whitespace-nowrap lg:inline">Notifications</span>
        </a>
      </div>

      <!-- User Dropdown: Existing behavior preserved -->
      <div class="relative shrink-0">
        <button
          type="button"
          aria-label="Toggle user menu"
          aria-haspopup="true"
          [attr.aria-expanded]="isMenuOpen()"
          (click)="toggleMenu()"
          class="flex items-center gap-1.5 rounded-full p-1 transition-colors hover:bg-gray-50 sm:gap-3 sm:p-1.5"
        >
          <img
            [src]="user()().photo"
            [alt]="user()().name"
            class="h-8 w-8 rounded-full object-cover ring-2 ring-gray-100 sm:h-10 sm:w-10"
          />

          <span class="hidden whitespace-nowrap text-sm font-semibold text-gray-800 lg:block">
            {{ user()().name }}
          </span>

          <svg
            class="hidden h-4 w-4 text-gray-500 transition-transform duration-200 sm:block"
            [class.rotate-180]="isMenuOpen()"
            viewBox="0 0 20 20"
            fill="none"
            aria-hidden="true"
          >
            <path
              d="m5 7.5 5 5 5-5"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>

        <div
          [class.invisible]="!isMenuOpen()"
          [class.opacity-0]="!isMenuOpen()"
          [class.translate-y-2]="!isMenuOpen()"
          [class.pointer-events-none]="!isMenuOpen()"
          [class.visible]="isMenuOpen()"
          [class.opacity-100]="isMenuOpen()"
          [class.translate-y-0]="isMenuOpen()"
          class="absolute right-0 top-full z-50 mt-3 w-56 rounded-2xl border border-gray-100 bg-white p-2 shadow-xl shadow-gray-200/50 transition-all duration-200"
        >
          <a
            routerLink="/profile"
            (click)="closeMenu()"
            class="block rounded-xl px-4 py-3 text-sm text-gray-700 transition-colors hover:bg-blue-50 hover:text-blue-700"
          >
            Profile
          </a>

          <a
            routerLink="/settings"
            (click)="closeMenu()"
            class="block rounded-xl px-4 py-3 text-sm text-gray-700 transition-colors hover:bg-blue-50 hover:text-blue-700"
          >
            Settings
          </a>

          <div class="my-2 border-t border-gray-100"></div>

          <button
            type="button"
            (click)="signOut()"
            class="w-full rounded-xl px-4 py-3 text-left text-sm font-medium text-red-600 transition-colors hover:bg-red-50"
          >
            Sign Out
          </button>
        </div>
      </div>
    </nav>
  </div>
</header>
